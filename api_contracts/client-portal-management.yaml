openapi: 3.0.3
info:
  title: Client Portal API
  version: 1.0.0
  description: OpenAPI for the Client Portal feature - admin management of client (party) accounts/credentials and the client-facing profile, password and order views.
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://sme-api.duckdns.org
    description: Production Server

tags:
  - name: Admin
    description: Admin endpoints to manage client portal accounts (list parties with credentials, export, reset credentials)
  - name: PartyGroup
    description: Admin endpoints to manage party groups (a single login shared across several member companies/parties)
  - name: Client
    description: Client-facing endpoints (profile, change password, own orders)
  - name: ClientInvoices
    description: Client-facing endpoints for viewing and downloading their own invoices

paths:
  /api/v1/client-portal/admin/clients:
    get:
      tags:
        - Admin
      operationId: getAllClientAccounts
      summary: Get all parties with their client portal account info (Admin only)
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - name: search
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/SortByFields'
        - $ref: '#/components/parameters/directionParam'
      responses:
        '200':
          description: Paginated list of parties with their client account info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResultClientAccount'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/admin/clients/export:
    get:
      tags:
        - Admin
      operationId: exportClientCredentials
      summary: Download client portal credentials as an Excel sheet (Admin only)
      description: Generates an Excel workbook listing party details and client portal login credentials. The initial password is only included for accounts that have not changed their password yet.
      parameters:
        - name: onlyPending
          in: query
          required: false
          description: When true, only include accounts whose initial password has not yet been changed
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Excel workbook (.xlsx)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/admin/clients/{partyId}/reset-credentials:
    post:
      tags:
        - Admin
      operationId: resetClientCredentials
      summary: Regenerate login credentials for a party's client account (Admin only)
      description: Generates a new random password for the client account linked to the given party and marks it as pending (so it appears again in the export until the client changes it).
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: New credentials generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCredentials'
        '404':
          description: Party or linked client account not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/admin/party-groups:
    get:
      tags:
        - PartyGroup
      operationId: getAllPartyGroups
      summary: List all party groups with their member companies and login info (Admin only)
      responses:
        '200':
          description: List of party groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartyGroup'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
      security:
        - oauth2: [ ]
    post:
      tags:
        - PartyGroup
      operationId: createPartyGroup
      summary: Create a party group and provision its single shared client login (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPartyGroup'
      responses:
        '201':
          description: Party group created, including the generated initial login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyGroup'
        '400':
          description: Bad request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/admin/party-groups/{groupId}/parties:
    put:
      tags:
        - PartyGroup
      operationId: setPartyGroupParties
      summary: Set the member companies/parties of a group (Admin only)
      description: Replaces the group's membership with the given parties. Each party keeps its own login working; the group login is an additional shared way to reach all member companies.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGroupPartiesRequest'
      responses:
        '200':
          description: Updated party group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyGroup'
        '404':
          description: Party group not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/admin/parties/{partyId}/group:
    put:
      tags:
        - PartyGroup
      operationId: assignPartyGroup
      summary: Assign a party to a group, or remove it from its group (Admin only)
      description: When a groupId is given, the party joins that group so it can also be reached via the shared group login. When groupId is null, the party leaves its group. The party's own login keeps working either way.
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPartyGroupRequest'
      responses:
        '204':
          description: Party group membership updated
        '404':
          description: Party or group not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/admin/party-groups/{groupId}/reset-credentials:
    post:
      tags:
        - PartyGroup
      operationId: resetPartyGroupCredentials
      summary: Regenerate the shared login credentials for a party group (Admin only)
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: New credentials generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCredentials'
        '404':
          description: Party group or linked login not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/me/companies:
    get:
      tags:
        - Client
      operationId: getMyCompanies
      summary: List the companies/parties the authenticated client can act as
      description: For a standalone client this is their single party; for a group login it is all the group's member companies. The client selects one and sends its id via the X-Party-Id header on subsequent requests.
      responses:
        '200':
          description: List of companies the client can act as
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Client access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/me/profile:
    get:
      tags:
        - Client
      operationId: getMyProfile
      summary: Get the authenticated client's profile
      responses:
        '200':
          description: Client profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfile'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Client access required
      security:
        - oauth2: [ ]

    put:
      tags:
        - Client
      operationId: updateMyProfile
      summary: Update the authenticated client's profile
      description: Allows the client to fill in/update optional profile information such as email and contact number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientProfileRequest'
      responses:
        '200':
          description: Updated client profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfile'
        '400':
          description: Bad request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Client access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/me/change-password:
    post:
      tags:
        - Client
      operationId: changeMyPassword
      summary: Change the authenticated client's password
      description: Requires the current password. Once changed, the auto-generated initial password is cleared and the account no longer appears as "pending" in the admin export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: Bad request (validation error or incorrect current password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Client access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/me/orders:
    get:
      tags:
        - Client
      operationId: getMyOrders
      summary: Get the authenticated client's own orders
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/SortByFields'
        - $ref: '#/components/parameters/directionParam'
      responses:
        '200':
          description: Paginated list of the client's own orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResultClientOrder'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Client access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/me/catalog:
    get:
      tags:
        - Client
      operationId: getMyCatalog
      summary: Get the product catalog available to the authenticated client
      description: Returns the list of items available for ordering, with their sizes and available platings/finishes. Stock quantities are intentionally never included.
      responses:
        '200':
          description: List of catalog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogItem'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Client access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/me/order-requests:
    get:
      tags:
        - Client
      operationId: getMyOrderRequests
      summary: Get the authenticated client's own order requests
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/SortByFields'
        - $ref: '#/components/parameters/directionParam'
      responses:
        '200':
          description: Paginated list of the client's own order requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResultOrderRequest'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Client access required
      security:
        - oauth2: [ ]

    post:
      tags:
        - Client
      operationId: submitOrderRequest
      summary: Submit a new order request from the authenticated client's cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrderRequest'
      responses:
        '201':
          description: Order request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRequest'
        '400':
          description: Bad request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Client access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/admin/order-requests:
    get:
      tags:
        - Admin
      operationId: getAllOrderRequests
      summary: Get all client order requests (Admin only)
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/SortByFields'
        - $ref: '#/components/parameters/directionParam'
        - name: partyId
          in: query
          required: false
          description: Filter by party (client) id
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: Filter by order request status
          schema:
            $ref: '#/components/schemas/OrderRequestStatus'
        - name: search
          in: query
          required: false
          description: Search by party name
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of order requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResultOrderRequest'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/admin/order-requests/{id}/status:
    post:
      tags:
        - Admin
      operationId: updateOrderRequestStatus
      summary: Approve, reject, or otherwise update the status of a client order request (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequestStatusRequest'
      responses:
        '200':
          description: Updated order request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRequest'
        '404':
          description: Order request not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/me/invoices:
    get:
      tags:
        - ClientInvoices
      operationId: getMyInvoices
      summary: Get the authenticated client's own invoices
      description: Returns invoices whose bill-to party matches the authenticated client's party (best-effort match by name).
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/SortByFields'
        - $ref: '#/components/parameters/directionParam'
      responses:
        '200':
          description: Paginated list of the client's own invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResultClientInvoice'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Client access required
      security:
        - oauth2: [ ]

  /api/v1/client-portal/me/invoices/{id}/pdf:
    get:
      tags:
        - ClientInvoices
      operationId: getMyInvoicePdf
      summary: Download a PDF of one of the authenticated client's own invoices
      description: Only invoices belonging to the authenticated client's party can be downloaded.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Invoice PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Invoice not found or does not belong to the authenticated client
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Client access required
      security:
        - oauth2: [ ]

components:
  securitySchemes:
    oauth2:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    pageParam:
      name: page
      in: query
      description: Page number starting from 0
      required: false
      schema:
        type: integer
        default: 0

    sizeParam:
      name: size
      in: query
      description: Number of items (records) per page
      required: false
      schema:
        type: integer
        default: 10

    directionParam:
      name: direction
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [ ASC, DESC ]

    SortByFields:
      name: sortByFields
      in: query
      description: Field to sort by
      schema:
        type: string
        enum: [ lastUpdatedAt, createdAt ]

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        detail:
          type: object

    ClientAccount:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: Client user account ID
        partyId:
          type: integer
          format: int64
        partyName:
          type: string
        gst:
          type: string
        contactNo:
          type: string
        email:
          type: string
        partyType:
          $ref: '#/components/schemas/PartyType'
        username:
          type: string
          description: Login username for the client portal
        credentialsPending:
          type: boolean
          description: True if the client has not yet changed the auto-generated initial password
        initialPassword:
          type: string
          description: Auto-generated initial password, only present while credentialsPending is true
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PaginatedResultClientAccount:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClientAccount'
        empty:
          type: boolean
        last:
          type: boolean
        first:
          type: boolean
        totalPages:
          type: integer
        totalElements:
          type: integer
        size:
          type: integer

    ClientCredentials:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          description: Plain-text password (only ever returned once, on generation/reset)

    Company:
      type: object
      description: A company/party the authenticated client can act as
      properties:
        partyId:
          type: integer
          format: int64
        partyName:
          type: string

    NewPartyGroup:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        email:
          type: string
        contactNo:
          type: string

    PartyGroup:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        contactNo:
          type: string
        username:
          type: string
          description: Login username for the group's shared client account
        credentialsPending:
          type: boolean
          description: True if the initial password has not yet been changed
        initialPassword:
          type: string
          description: Auto-generated initial password, only present while credentialsPending is true
        parties:
          type: array
          description: Member companies/parties in this group
          items:
            $ref: '#/components/schemas/Company'
        createdAt:
          type: string
          format: date-time

    SetGroupPartiesRequest:
      type: object
      required:
        - partyIds
      properties:
        partyIds:
          type: array
          items:
            type: integer
            format: int64

    AssignPartyGroupRequest:
      type: object
      properties:
        groupId:
          type: integer
          format: int64
          description: Group to assign the party to; null/omitted removes the party from its group
          nullable: true

    PartyType:
      type: string
      enum:
        - CUSTOMER
        - VENDOR
        - BOTH

    ClientProfile:
      type: object
      properties:
        username:
          type: string
        partyId:
          type: integer
          format: int64
        name:
          type: string
        gst:
          type: string
        contactNo:
          type: string
        email:
          type: string
        partyType:
          $ref: '#/components/schemas/PartyType'

    UpdateClientProfileRequest:
      type: object
      properties:
        email:
          type: string
        contactNo:
          type: string

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          description: New plain-text password (min 6 characters)

    ClientOrder:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderDate:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientOrderItem'
        createdAt:
          type: string
          format: date-time

    StageQuantity:
      type: object
      description: >-
        How much of one order line is sitting at one stage of the works, in Kg with the piece
        equivalent alongside. pc is derived from kg via the size's 1-pc weight, so it is absent when
        that weight is not set on the item master.
      properties:
        kg:
          type: number
          format: double
        pc:
          type: number
          format: double

    OrderLineStages:
      type: object
      description: >-
        An order line's quantity split across the stages of the works. A single line is normally in
        several at once -- 100 Kg ordered, 50 Kg sent to the plater of which 30 Kg is back, reads as
        approved 50, inPlating 20, readyToDispatch 30. On a line whose books balance the stages add
        up to ordered, less any ghati burnt off in the process; they can exceed it where the works
        recorded more movement than was ordered (for instance dispatching a full line while part of
        it is still with the plater), since each figure reports what was actually booked.
      properties:
        ordered:
          $ref: '#/components/schemas/StageQuantity'
        approved:
          $ref: '#/components/schemas/StageQuantity'
          description: Ordered but not yet sent out for plating.
        inPlating:
          $ref: '#/components/schemas/StageQuantity'
          description: Out with the job worker and not yet returned.
        readyToDispatch:
          $ref: '#/components/schemas/StageQuantity'
          description: Returned from the job worker and not yet dispatched.
        dispatched:
          $ref: '#/components/schemas/StageQuantity'
          description: Already gone out to the client.
        ghatiKg:
          type: number
          format: double
          description: Weight lost in the process; it leaves plating but never becomes dispatchable.

    ClientOrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        itemName:
          type: string
        sizeInInch:
          type: string
        sizeInMm:
          type: string
        plating:
          type: string
        qtyPc:
          type: number
          format: double
        qtyKg:
          type: number
          format: double
        pendingPc:
          type: number
          format: double
        dispatchedPc:
          type: number
          format: double
        jobActionDone:
          type: boolean
        jobWork:
          $ref: '#/components/schemas/ClientItemJobWork'
        stages:
          $ref: '#/components/schemas/OrderLineStages'

    ClientItemJobWork:
      type: object
      description: Live job-work progress for this order item; null when the item has not been sent to job work.
      properties:
        type:
          type: string
          description: OUTSIDE | INHOUSE | JOB_WORK | MANUAL
        typeLabel:
          type: string
          description: Human label for the type (e.g. "Outside", "In House").
        status:
          type: string
          description: PENDING | COMPLETE
        finish:
          type: string
        jobWorkNo:
          type: integer
          format: int32
        sentKg:
          type: number
          format: double
        returnedKg:
          type: number
          format: double
        ghatiKg:
          type: number
          format: double
        remainingKg:
          type: number
          format: double

    PaginatedResultClientOrder:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClientOrder'
        empty:
          type: boolean
        last:
          type: boolean
        first:
          type: boolean
        totalPages:
          type: integer
        totalElements:
          type: integer
        size:
          type: integer

    CatalogItemSize:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sizeInInch:
          type: string
        sizeInMm:
          type: string
        pcsPerBox:
          type: integer
          description: Number of pieces per box (from inventory master)
        pcsPerCarton:
          type: integer
          description: Total pieces per carton (from inventory master)

    CatalogItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        itemName:
          type: string
        category:
          type: string
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItemSize'
        platings:
          type: array
          items:
            type: string

    OrderRequestStatus:
      type: string
      description: >-
        Lifecycle status of a client order request. PENDING_APPROVAL / APPROVED / REJECTED are set
        by an admin; IN_PLATING, READY_TO_DISPATCH and DISPATCHED are derived from the order created
        on approval as it moves through job work and dispatch. IN_PROGRESS is legacy and is no longer
        derived.
      enum:
        - PENDING_APPROVAL
        - APPROVED
        - IN_PLATING
        - READY_TO_DISPATCH
        - DISPATCHED
        - IN_PROGRESS
        - COMPLETED
        - REJECTED

    OrderItemStage:
      type: string
      description: >-
        Stage a single requested line item is at in the works. An order request as a whole reports
        the furthest stage any of its items has reached, except DISPATCHED which needs every item;
        this per-item stage is what says which items are actually where.
      enum:
        - APPROVED
        - IN_PLATING
        - READY_TO_DISPATCH
        - DISPATCHED

    NewOrderRequestItem:
      type: object
      required:
        - itemName
        - plating
        - qtyPc
      properties:
        itemId:
          type: integer
          format: int64
          description: Catalog item id (if known)
        sizeId:
          type: integer
          format: int64
          description: Catalog item size id (if known)
        itemName:
          type: string
        category:
          type: string
        sizeInInch:
          type: string
        sizeInMm:
          type: string
        plating:
          type: string
        qtyPc:
          type: number
          format: double
        qtyKg:
          type: number
          format: double

    NewOrderRequest:
      type: object
      required:
        - items
      properties:
        orderDate:
          type: string
          format: date
          description: Defaults to today if not provided
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NewOrderRequestItem'

    OrderRequestItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        itemId:
          type: integer
          format: int64
        sizeId:
          type: integer
          format: int64
        itemName:
          type: string
        category:
          type: string
        sizeInInch:
          type: string
        sizeInMm:
          type: string
        plating:
          type: string
        qtyPc:
          type: number
          format: double
        qtyKg:
          type: number
          format: double
        pendingPc:
          type: number
          format: double
        stage:
          $ref: '#/components/schemas/OrderItemStage'
        sentKg:
          type: number
          format: double
          description: Net Kg sent out for job work / plating for this line, if any.
        returnedKg:
          type: number
          format: double
          description: >-
            Net Kg already returned from the job worker. On a partial return this is exactly the
            weight that is ready to dispatch.
        remainingKg:
          type: number
          format: double
          description: Net Kg still lying with the job worker (sent - returned - ghati).
        dispatchedPc:
          type: number
          format: double
          description: Pieces dispatched against this line so far.
        stages:
          $ref: '#/components/schemas/OrderLineStages'

    OrderRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        partyId:
          type: integer
          format: int64
        partyName:
          type: string
        username:
          type: string
        status:
          $ref: '#/components/schemas/OrderRequestStatus'
        orderDate:
          type: string
          format: date
        orderId:
          type: integer
          format: int64
          description: ID of the order created in Order Management once approved, if any.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderRequestItem'
        createdAt:
          type: string
          format: date-time

    PaginatedResultOrderRequest:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderRequest'
        empty:
          type: boolean
        last:
          type: boolean
        first:
          type: boolean
        totalPages:
          type: integer
        totalElements:
          type: integer
        size:
          type: integer

    UpdateOrderRequestStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/OrderRequestStatus'

    ClientInvoiceType:
      type: string
      enum:
        - EXPORT
        - COMMERCIAL
        - PACKAGING_LIST

    ClientInvoice:
      type: object
      properties:
        id:
          type: integer
          format: int64
        invoiceNo:
          type: string
        invoiceDate:
          type: string
          format: date
        invoiceType:
          $ref: '#/components/schemas/ClientInvoiceType'
        exporterCompanyName:
          type: string
        createdAt:
